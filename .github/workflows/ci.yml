name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: |
          pytest -v

  smoke:
    name: End-to-End Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Start Agent Guardrail Server
        run: |
          cd src && python -m uvicorn policy_engine:app --port 8080 &
          sleep 3

      - name: Verify Healthcheck & Examples
        run: |
          curl --fail http://127.0.0.1:8080/healthz
          
          # Test README examples
          curl -s -f "http://127.0.0.1:8080/api/emails/alice/read?agent_id=test-bot"
          
          # Bob read should return 403
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080/api/emails/bob/read?agent_id=test-bot")
          test "$STATUS" = "403"
          
          # Alice delete should return 403
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "http://127.0.0.1:8080/api/records/alice/delete?agent_id=test-bot")
          test "$STATUS" = "403"

      - name: Verify Audit Report CLI
        run: |
          python src/cli.py report --audit src/audit.jsonl
